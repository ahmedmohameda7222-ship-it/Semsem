name: Our Space verification

on:
  push:
    branches:
      - main
      - 'verify/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: our-space-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-browser:
    name: Lint, tests, build and mobile browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: TypeScript and production bundle
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Local browser tests
        run: npm run test:browser

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: our-space-browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
